function calc(sid){
  const tot=ATTEND.length;
  const pres=ATTEND.filter(a=>a.rec[sid]===1).length;
  const freq=tot>0?Math.round((pres/tot)*100):0;
  const d=DELIV[sid]||{};
  const ent=['fi','se','re'].filter(k=>d[k]==='enviado').length;
  const pend=['fi','se','re'].filter(k=>d[k]==='nao_enviado').length;
  let sit='regular';
  if(freq<MIN)sit='reprovado_falta';
  else if(pend>=2)sit='reprovado_pendencia';
  else if(pend===1||d.fi==='atrasado'||d.se==='atrasado'||d.re==='atrasado')sit='pendente';
  else if(freq<80)sit='em_risco';
  else if(ent===3&&freq>=MIN)sit='aprovado';
  return{tot,pres,aus:tot-pres,freq,ent,pend,sit};
}

<div class="lh"><div class="ey">Sistema Acadêmico</div><h1>Gestão de Turma</h1><div class="ld"></div></div>
<div class="lc">
  <div class="tr">
    <button class="trb active" id="btp">Professor</button>
    <button class="trb" id="bta">Aluno</button>
  </div>
  <div class="err hidden" id="lerr"></div>
  <div class="fg"><label class="fl">Login</label><input class="inp iw" id="ilog" placeholder="professor" autocomplete="username"/></div>
  <div class="fg" style="margin-bottom:20px"><label class="fl">Senha</label><input class="inp iw" id="ipwd" type="password" placeholder="••••••" autocomplete="current-password"/></div>
  <button class="btn bp iw" id="bent">Entrar</button>
  <div class="lhint"><strong>Credenciais demo</strong>
    Professor: <code>professor</code> / <code>prof123</code><br/>
    Alunos: primeiro nome minúsculo (ex: <code>ana</code>) / <code>aluno123</code>
  </div>
</div></div>`;}

function bLogin(){
  let role='p';
  q('#btp').onclick=()=>{role='p';q('#btp').classList.add('active');q('#bta').classList.remove('active');q('#ilog').placeholder='professor';};
  q('#bta').onclick=()=>{role='a';q('#bta').classList.add('active');q('#btp').classList.remove('active');q('#ilog').placeholder='ex: ana';};
  q('#ipwd').onkeydown=e=>{if(e.key==='Enter')doLogin();};
  q('#bent').onclick=doLogin;
  function doLogin(){
    const lg=q('#ilog').value.trim().toLowerCase(),pw=q('#ipwd').value,er=q('#lerr');
    if(role==='p'){
      if(lg===PROF.login&&pw===PROF.senha){CU={role:'p',name:PROF.name};TAB='turma';SID=null;R();}
      else{er.textContent='Login ou senha incorretos.';er.classList.remove('hidden');}
    } else {
      const s=STUDS.find(x=>x.login===lg&&x.pwd===pw);
      if(s){CU={role:'a',sid:s.id,name:s.name};TAB='perfil';SID=s.id;R();}
      else{er.textContent='Login ou senha incorretos.';er.classList.remove('hidden');}
    }
  }
}

const PT=[{k:'turma',l:'📋 Turma'},{k:'chamada',l:'✅ Chamada'},{k:'trabalhos',l:'📝 Trabalhos'},{k:'entregas',l:'📦 Entregas'},{k:'dashboard',l:'📊 Dashboard'},{k:'materiais',l:'📚 Materiais'}];
function rProf(){
  let c='';const t=TAB||'turma';
  if(t==='turma')c=rTurma();else if(t==='chamada')c=rChamada();else if(t==='trabalhos')c=rTrab();
  else if(t==='entregas')c=rEntr();else if(t==='dashboard')c=rDash();else if(t==='materiais')c=rMat(true);
  return rHdr('bprof','Professor')+`<div class="wrap">${rTabs(PT,t)}${c}</div>`;
}
function bProf(){
  q('#blo').onclick=()=>{CU=null;R();};
  qa('.tab').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;R();});
  if(TAB==='turma')bTurma();else if(TAB==='chamada')bChamada();
  else if(TAB==='trabalhos')bTrab();else if(TAB==='entregas')bEntr();
  else if(TAB==='materiais')bMat(true);
}

// ── TURMA ──────────────────────────────────
function rTurma(){
  let rows=STUDS.map(s=>({...s,...calc(s.id)}));
  if(fSrch)rows=rows.filter(s=>s.name.toLowerCase().includes(fSrch.toLowerCase()));
  if(fSit!=='todos')rows=rows.filter(s=>s.sit===fSit);
  rows.sort((a,b)=>{let va=a[sCol],vb=b[sCol];if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}return sDir==='asc'?(va>vb?1:-1):(va<vb?1:-1);});
  function th(c,l){return`<button class="sb" data-sort="${c}">${l} ${sCol===c?(sDir==='asc'?'↑':'↓'):'↕'}</button>`;}
  return`<div class="flex fac g12 mb20" style="flex-wrap:wrap">
    <input class="inp" id="tsr" placeholder="Buscar aluno…" value="${esc(fSrch)}" style="min-width:200px"/>
    <select class="sel" id="tfi">
      <option value="todos"${fSit==='todos'?' selected':''}>Todas as situações</option>
      ${Object.entries(SL).map(([k,v])=>`<option value="${k}"${fSit===k?' selected':''}>${v}</option>`).join('')}
    </select>
    <button class="btn bgh bsm" id="bcsv" style="margin-left:auto">⬇ CSV</button>
  </div>
  <div class="cf"><div class="tbl-wrap"><table class="tbl"><thead><tr>
    <th>${th('name','Nome')}</th><th>${th('pres','Presenças')}</th><th>${th('freq','Frequência')}</th><th>${th('ent','Entregas')}</th><th>${th('sit','Situação')}</th>
  </tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="fw5">${esc(r.name)}</td><td>${r.pres}/${r.tot}</td>
    <td><div class="flex fac g8"><span class="fw5" style="color:${r.freq<MIN?'var(--danger)':'var(--success)'};min-width:34px">${r.freq}%</span><div style="flex:1;min-width:60px">${pg(r.freq,100,r.freq<MIN?'var(--danger)':r.freq<80?'#e6a817':'var(--success)')}</div></div></td>
    <td>${r.ent}/3</td><td>${bdg('s',r.sit)}</td></tr>`).join('')}
  </tbody></table></div><div class="tbl-foot">${rows.length} aluno(s)</div></div>`;
}
function bTurma(){
  q('#tsr').oninput=e=>{fSrch=e.target.value;R();};
  q('#tfi').onchange=e=>{fSit=e.target.value;R();};
  qa('.sb').forEach(b=>b.onclick=()=>{const c=b.dataset.sort;if(sCol===c)sDir=sDir==='asc'?'desc':'asc';else{sCol=c;sDir='asc';}R();});
  q('#bcsv').onclick=()=>{
    const rows=STUDS.map(s=>({...s,...calc(s.id)}));
    const h='Nome,Presenças,Ausências,Frequência(%),Entregas,Situação\n';
    const b=rows.map(r=>`"${r.name}",${r.pres},${r.aus},${r.freq}%,${r.ent}/3,"${SL[r.sit]||r.sit}"`).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(h+b);a.download='turma.csv';a.click();
  };
}

// ── CHAMADA ────────────────────────────────
function rChamada(){
  if(!AULA&&ATTEND.length>0)AULA=ATTEND[ATTEND.length-1].id;
  const aula=ATTEND.find(a=>a.id===AULA);
  const pc=a=>Object.values(a.rec).filter(Boolean).length;
  const sidebar=[...ATTEND].reverse().map(a=>`<div class="ai${a.id===AULA?' active':''}" data-aula="${a.id}"><div class="ai-l">${esc(a.lbl)}</div><div class="ai-c">${pc(a)}/${STUDS.length} pres.</div></div>`).join('');
  const lista=aula?STUDS.map(s=>{const p=aula.rec[s.id]===1;return`<div class="pi ${p?'presente':'ausente'}" data-sid="${s.id}"><div class="pio">${p?'✓':'✗'}</div><span class="f13 fw5">${esc(s.name)}</span><span class="ps">${p?'Presente':'Ausente'}</span></div>`;}).join(''):'';
  return`<div class="cg">
    <div>
      <div class="flex fac fjsb mb12"><span class="f12 cm fw5" style="text-transform:uppercase;letter-spacing:.5px">Aulas</span><button class="btn bg bsm" id="bna">+ Nova</button></div>
      <div class="card mb12 hidden" id="fna" style="padding:12px">
        <input type="date" class="inp iw mb8" id="ind"/>
        <button class="btn bp bsm iw" id="bca">Criar Aula</button>
      </div>
      <div id="alist">${sidebar}</div>
    </div>
    <div class="cf">
      ${aula?`<div class="flex fac fjsb" style="padding:14px 18px;border-bottom:1px solid var(--border);background:var(--cream)">
        <div><div style="font-size:15px;font-weight:600">${esc(aula.lbl)}</div><div class="f12 cm mt4">${pc(aula)} pres. · ${STUDS.length-pc(aula)} aus.</div></div>
        <div class="flex g8"><button class="btn bgh bsm" id="btdp">Todos P</button><button class="btn bgh bsm" id="btda">Todos A</button></div>
      </div><div style="padding:4px" id="plst">${lista}</div>`
      :'<div style="padding:40px;text-align:center;color:var(--muted)">Selecione ou crie uma aula</div>'}
    </div>
  </div>`;
}
function bChamada(){
  qa('.ai').forEach(el=>el.onclick=()=>{AULA=el.dataset.aula;R();});
  q('#bna')&&(q('#bna').onclick=()=>q('#fna').classList.toggle('hidden'));
  q('#bca')&&(q('#bca').onclick=()=>{
    const dt=q('#ind').value;if(!dt)return;
    const p=dt.split('-'),lbl=`${p[2]}/${p[1]} – Aula ${ATTEND.length+1}`;
    const rec={};STUDS.forEach(s=>rec[s.id]=0);
    const na={id:'a'+Date.now(),date:dt,lbl,rec};ATTEND.push(na);AULA=na.id;R();
  });
  qa('.pi').forEach(el=>el.onclick=()=>{
    const sid=+el.dataset.sid,a=ATTEND.find(x=>x.id===AULA);
    if(a){a.rec[sid]=a.rec[sid]===1?0:1;R();}
  });
  q('#btdp')&&(q('#btdp').onclick=()=>{const a=ATTEND.find(x=>x.id===AULA);if(a){STUDS.forEach(s=>a.rec[s.id]=1);R();}});
  q('#btda')&&(q('#btda').onclick=()=>{const a=ATTEND.find(x=>x.id===AULA);if(a){STUDS.forEach(s=>a.rec[s.id]=0);R();}});
}

function bEntr(){
  q('#esr').oninput=e=>{fSrch=e.target.value;R();};
  q('#eat').onchange=e=>{fAtv=e.target.value;R();};
  q('#est').onchange=e=>{fDSt=e.target.value;R();};
  qa('.ss').forEach(sel=>sel.onchange=()=>{
    const sid=+sel.dataset.sid,k=sel.dataset.key;
    if(!DELIV[sid])DELIV[sid]={};DELIV[sid][k]=sel.value;
    sel.style.background=DC[sel.value];sel.style.color=DTC[sel.value];
  });
}

// ── DASHBOARD ──────────────────────────────
function rDash(){
  const stats=STUDS.map(s=>({...s,...calc(s.id)}));
  const tot=STUDS.length;
  const mf=Math.round(stats.reduce((a,s)=>a+s.freq,0)/tot);
  const fb=stats.filter(s=>s.freq<MIN).length;
  const fi=Object.values(DELIV).filter(d=>d.fi==='enviado').length;
  const se=Object.values(DELIV).filter(d=>d.se==='enviado').length;
  const re=Object.values(DELIV).filter(d=>d.re==='enviado').length;
  const ap=stats.filter(s=>s.sit==='aprovado').length;
  const er=stats.filter(s=>['em_risco','pendente'].includes(s.sit)).length;
  const rp=stats.filter(s=>s.sit.startsWith('reprovado')).length;
  const fg=[
    {l:'≥ 90%',v:stats.filter(s=>s.freq>=90).length,c:'var(--success)'},
    {l:'75–90%',v:stats.filter(s=>s.freq>=75&&s.freq<90).length,c:'var(--gold)'},
    {l:'< 75%',v:stats.filter(s=>s.freq<75).length,c:'var(--danger)'},
  ];
  const mx=Math.max(...fg.map(g=>g.v),1);
  const bar=`<div class="bc">${fg.map(g=>`<div class="bcol"><div class="bv" style="color:${g.c}">${g.v}</div><div class="br" style="height:${Math.round((g.v/mx)*90)}px;background:${g.c}"></div><div class="bl">${g.l}</div></div>`).join('')}</div>`;
  const sd=Object.entries(SL).map(([k,v])=>({k,v,n:stats.filter(s=>s.sit===k).length})).filter(d=>d.n>0);
  return`<div class="gs mb24">
    <div class="sc"><div class="sc-lbl">Total de Alunos</div><div class="sc-val">${tot}</div></div>
    <div class="sc"><div class="sc-lbl">Média de Frequência</div><div class="sc-val" style="color:${mf<MIN?'var(--danger)':'var(--success)'}">${mf}%</div></div>
    <div class="sc"><div class="sc-lbl">Freq. Abaixo 75%</div><div class="sc-val" style="color:${fb>0?'var(--danger)':'var(--success)'}">${fb}</div><div class="sc-sub">em risco</div></div>
    <div class="sc"><div class="sc-lbl">Aprovados</div><div class="sc-val" style="color:var(--success)">${ap}</div></div>
    <div class="sc"><div class="sc-lbl">Em Risco/Pend.</div><div class="sc-val" style="color:var(--warning)">${er}</div></div>
    <div class="sc"><div class="sc-lbl">Reprovados</div><div class="sc-val" style="color:var(--danger)">${rp}</div></div>
  </div>
  <div class="g2 mb20">
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:16px">Entregas por Atividade</h3>
      ${[{l:'Fichamento',v:fi},{l:'Seminário',v:se},{l:'Rel. Final',v:re}].map(x=>`<div class="mb16"><div class="flex fac fjsb f12 mb4"><span class="cm">${x.l}</span><span class="fw5">${x.v}/${tot}</span></div>${pg(x.v,tot,'var(--navy)')}</div>`).join('')}
    </div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:16px">Distribuição de Frequência</h3>${bar}</div>
  </div>
  <div class="card">
    <h3 style="font-size:15px;margin-bottom:16px">Situação da Turma</h3>
    <div class="flex g20" style="flex-wrap:wrap;align-items:center">
      ${rPie(sd,tot)}
      <div class="pl">${sd.map(d=>`<div class="pli"><div class="pd" style="background:${SC[d.k]}"></div><span>${d.v}</span><span class="fw5" style="margin-left:auto;min-width:24px">${d.n}</span><span class="f11 cm" style="min-width:30px">${Math.round(d.n/tot*100)}%</span></div>`).join('')}</div>
    </div>
  </div>`;
}
function rPie(items,tot){
  if(!tot||!items.length)return'';
  let ang=-Math.PI/2;
  const cx=90,cy=90,r=72,ri=42;
  const paths=items.map(d=>{
    const a=(d.n/tot)*2*Math.PI;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(ang+a),y2=cy+r*Math.sin(ang+a);
    const i1x=cx+ri*Math.cos(ang),i1y=cy+ri*Math.sin(ang);
    const i2x=cx+ri*Math.cos(ang+a),i2y=cy+ri*Math.sin(ang+a);
    const lg=a>Math.PI?1:0;
    const path=`M ${i1x} ${i1y} L ${x1} ${y1} A ${r} ${r} 0 ${lg} 1 ${x2} ${y2} L ${i2x} ${i2y} A ${ri} ${ri} 0 ${lg} 0 ${i1x} ${i1y} Z`;
    ang+=a;
    return`<path d="${path}" fill="${SC[d.k]}" stroke="#fff" stroke-width="2"/>`;
  }).join('');
  return`<svg width="180" height="180" viewBox="0 0 180 180">${paths}</svg>`;
}

    <div class="fg"><label class="fl">Categoria</label><select class="sel iw" id="mcat">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">Título</label><input class="inp iw" id="mti"/></div>
    <div class="fg"><label class="fl">Descrição</label><input class="inp iw" id="mde"/></div>
    <div class="fg"><label class="fl">Link</label><input class="inp iw" id="mlk" placeholder="https://"/></div>
    <div class="flex g8" style="justify-content:flex-end">
      <button class="btn bgh" id="mmca">Cancelar</button><button class="btn bp" id="mms">Adicionar</button>
    </div>
  </div></div>`:''}`;
}
function bMat(ce){
  qa('.mc-btn').forEach(b=>b.onclick=()=>{aCat=b.dataset.cat;R();});
  if(!ce)return;
  qa('[data-dm]').forEach(b=>b.onclick=()=>{MATS=MATS.filter(m=>m.id!==b.dataset.dm);R();});
  q('#bam').onclick=()=>q('#mm').classList.remove('hidden');
  q('#mmc').onclick=()=>q('#mm').classList.add('hidden');
  q('#mmca').onclick=()=>q('#mm').classList.add('hidden');
  q('#mms').onclick=()=>{
    const ti=q('#mti').value.trim();if(!ti)return;
    MATS.push({id:'m'+Date.now(),cat:q('#mcat').value,ti,de:q('#mde').value,lk:q('#mlk').value});R();
  };
}

// ════════════════════════════════════════════
// ALUNO
// ════════════════════════════════════════════
const AT=[{k:'lista',l:'👥 Alunos'},{k:'perfil',l:'👤 Perfil'},{k:'trabalhos',l:'📝 Trabalhos'},{k:'frequencia',l:'📅 Frequência'},{k:'totais',l:'📊 Resumo'},{k:'materiais',l:'📚 Materiais'}];
function rAluno(){
  let c='';const t=TAB||'perfil';
  if(t==='lista')c=rALista();else if(t==='perfil')c=rAPerfil();
  else if(t==='trabalhos')c=rATrab();else if(t==='frequencia')c=rAFreq();
  else if(t==='totais')c=rATot();else if(t==='materiais')c=rMat(false);
  return rHdr('baluno','Aluno')+`<div class="wrap">${rTabs(AT,t)}${c}</div>`;
}
function bAluno(){
  q('#blo').onclick=()=>{CU=null;R();};
  qa('.tab').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;R();});
  if(TAB==='lista')bALista();else if(TAB==='materiais')bMat(false);
}
function rALista(){
  const rows=STUDS.filter(s=>s.name.toLowerCase().includes(fSrch.toLowerCase()));
  return`<input class="inp mb16" id="asr" placeholder="Buscar por nome…" value="${esc(fSrch)}" style="min-width:240px"/>
  <div class="gc">${rows.map(s=>{const st=calc(s.id);return`<div class="card alc" data-sel="${s.id}">
    <div class="flex fac g12 mb10">${av(s.name)}<div><div class="f13 fw5">${esc(s.name)}</div><div class="f11 cm">${s.mat}</div></div></div>
    <div class="flex fac fjsb mb8"><span class="f11 cm">Frequência</span><span class="f12 fw5" style="color:${st.freq<MIN?'var(--danger)':'var(--success)'}">${st.freq}%</span></div>
    ${bdg('s',st.sit)}
  </div>`;}).join('')}</div>`;
}
function bALista(){
  q('#asr').oninput=e=>{fSrch=e.target.value;R();};
  qa('[data-sel]').forEach(el=>el.onclick=()=>{SID=+el.dataset.sel;TAB='perfil';R();});
}
function rAPerfil(){
  if(!SID)return`<div class="tc cm" style="padding:40px">Selecione um aluno na aba "Alunos".</div>`;
  const s=STUDS.find(x=>x.id===SID),st=calc(s.id),d=DELIV[s.id]||{};
  return`<div class="g2">
    <div class="card" style="grid-column:1/-1">
      <div class="flex fac g16">${av(s.name,'lg')}<div style="flex:1"><h2 style="font-size:22px;margin-bottom:3px">${esc(s.name)}</h2><div class="f12 cm">Matrícula: ${s.mat}</div></div>${bdg('s',st.sit)}</div>
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:14px">Frequência</h3>
      <div style="font-family:'Crimson Pro',serif;font-size:38px;font-weight:600;color:${st.freq<MIN?'var(--danger)':'var(--success)'};margin-bottom:8px">${st.freq}%</div>
      ${pg(st.freq,100,st.freq<MIN?'var(--danger)':'var(--success)')}
      <div class="flex g20 mt12 f12"><span><span class="cs fw5">${st.pres}</span> presenças</span><span><span class="cd fw5">${st.aus}</span> ausências</span><span><span class="cm">${st.tot}</span> aulas</span></div>
      ${st.freq<MIN?`<div class="al-danger mt12">⚠ Frequência abaixo do mínimo (${MIN}%)</div>`:''}
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:14px">Atividades</h3>
      ${[['fi','Fichamento'],['se','Seminário'],['re','Rel. Final']].map(([k,l])=>`<div class="flex fac fjsb mb10"><span class="f13">${l}</span>${bdg('d',d[k]||'nao_enviado')}</div>`).join('')}
    </div>
  </div>`;
}
function rATrab(){
  if(!SID)return`<div class="tc cm" style="padding:40px">Selecione um aluno.</div>`;
  const d=DELIV[SID]||{};
  const KM={w1:{k:'fi',dk:'fd'},w2:{k:'se',dk:'sd'},w3:{k:'re',dk:'rd'}};
  return`<div class="gc">${WORKS.map(w=>{const{k,dk}=KM[w.id];const st=d[k]||'nao_enviado',de=d[dk]||'';
    return`<div class="card">
      <div class="flex fac fjsb mb12"><h3 style="font-size:15px">${esc(w.name)}</h3>${bdg('d',st)}</div>
      <p class="f13 cm mb12" style="line-height:1.6">${esc(w.desc)}</p>
      <div class="f12 cm mb6">Prazo: <strong style="color:var(--text)">${esc(w.dl)}</strong></div>
      ${de?`<div class="f12 cm mb12">Enviado em: <strong style="color:var(--text)">${esc(de)}</strong></div>`:''}
      <a href="${esc(w.fl)}" target="_blank" rel="noreferrer" style="display:inline-block;font-size:12px;padding:5px 12px;border:1px solid var(--border);border-radius:6px;text-decoration:none;color:var(--info)">🔗 Formulário</a>
    </div>`;}).join('')}</div>`;
}
function rAFreq(){
  if(!SID)return`<div class="tc cm" style="padding:40px">Selecione um aluno.</div>`;
  const s=STUDS.find(x=>x.id===SID),st=calc(s.id);
  return`<div class="gs mb24">
    <div class="sc"><div class="sc-lbl">Frequência</div><div class="sc-val" style="color:${st.freq<MIN?'var(--danger)':'var(--success)'}">${st.freq}%</div></div>
    <div class="sc"><div class="sc-lbl">Presenças</div><div class="sc-val cs">${st.pres}</div></div>
    <div class="sc"><div class="sc-lbl">Ausências</div><div class="sc-val cd">${st.aus}</div></div>
    <div class="sc"><div class="sc-lbl">Total de Aulas</div><div class="sc-val">${st.tot}</div></div>
  </div>
  ${st.freq<MIN?`<div class="al-danger mb20">⚠ <strong>Atenção:</strong> Frequência abaixo do mínimo (${MIN}%). Risco de reprovação por falta.</div>`:''}
  <div class="cf">
    <div style="padding:12px 16px;background:var(--cream);border-bottom:1px solid var(--border)"><h3 style="font-size:15px">Registro por Aula — ${esc(s.name)}</h3></div>
    <table class="tbl"><thead><tr><th>Aula</th><th>Data</th><th style="text-align:center">Situação</th></tr></thead>
    <tbody>${ATTEND.map((a,i)=>{const p=a.rec[s.id]===1;return`<tr style="background:${i%2===0?'#fff':'var(--cream)'}">
      <td>${esc(a.lbl.split('–')[1]?.trim()||a.lbl)}</td>
      <td>${a.date.split('-').reverse().join('/')}</td>
      <td style="text-align:center"><span style="display:inline-block;padding:3px 12px;border-radius:99px;font-size:11px;font-weight:500;background:${p?'var(--successBg)':'var(--dangerBg)'};color:${p?'var(--success)':'var(--danger)'}">${p?'Presente':'Ausente'}</span></td>
    </tr>`;}).join('')}</tbody></table>
  </div>`;
}
function rATot(){
  if(!SID)return`<div class="tc cm" style="padding:40px">Selecione um aluno.</div>`;
  const s=STUDS.find(x=>x.id===SID),st=calc(s.id);
  return`<div class="gs mb24">
    <div class="sc"><div class="sc-lbl">Frequência</div><div class="sc-val" style="color:${st.freq<MIN?'var(--danger)':'var(--success)'}">${st.freq}%</div></div>
    <div class="sc"><div class="sc-lbl">Atividades Entregues</div><div class="sc-val">${st.ent}/3</div></div>
    <div class="sc"><div class="sc-lbl">Pendentes</div><div class="sc-val" style="color:${st.pend>0?'var(--warning)':'var(--success)'}">${st.pend}</div></div>
    <div class="sc"><div class="sc-lbl">Situação</div><div class="sc-val" style="font-size:20px;color:${SC[st.sit]}">${SL[st.sit]}</div></div>
  </div>
  <div class="card">
    <h3 style="font-size:15px;margin-bottom:16px">Painel Geral — ${esc(s.name)}</h3>
    <div class="mb16"><div class="flex fac fjsb f13 mb6"><span class="cm">Frequência</span><span class="fw5">${st.freq}% (${st.pres}/${st.tot} aulas)</span></div>${pg(st.freq,100,st.freq<MIN?'var(--danger)':'var(--navy)')}${st.freq<MIN?`<div class="f11 cd mt4">Abaixo do mínimo de ${MIN}%</div>`:''}</div>
    <div class="mb16"><div class="flex fac fjsb f13 mb6"><span class="cm">Atividades concluídas</span><span class="fw5">${st.ent}/3</span></div>${pg(st.ent,3,'var(--navy)')}</div>
    <div style="margin-top:20px;padding:12px 16px;background:${SB[st.sit]};border-radius:8px"><span style="font-size:13px;font-weight:500;color:${SC[st.sit]}">Situação Acadêmica: ${SL[st.sit]}</span></div>
  </div>`;
}

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
R();
</script>
</body>
</html>
