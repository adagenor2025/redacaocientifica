<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AcadêmiCo · Redação Científica</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    :root {
      --cream:    #f0f4f8;
      --paper:    #ffffff;
      --navy:     #003087;
      --navy2:    #00409e;
      --rust:     #c0182a;
      --gold:     #c0182a;
      --green:    #1a5c96;
      --ink:      #0a0c10;
      --muted:    #5a6478;
      --border:   #d0d8e8;
      --sidebar:  252px;
      --r:        8px;
      --shadow:   0 2px 16px rgba(0,48,135,.09);
      --shadow-lg:0 8px 32px rgba(0,48,135,.16);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;min-height:100%}
    body{font-family:'DM Sans',sans-serif;font-weight:400;background:#eef2f9;color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6}
    button{font-family:inherit;cursor:pointer}
    input{font-family:inherit}

    /* ── LAYOUT ── */
    .layout{display:flex;height:100vh;overflow:hidden}
    .sidebar{width:var(--sidebar);background:linear-gradient(180deg,#002070 0%,#003087 100%);color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;border-right:3px solid #c0182a}
    .main{flex:1;overflow-y:auto;background:#eef2f9}

    /* ── SIDEBAR ── */
    .sb-logo{padding:1.5rem 1.4rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.07)}
    .sb-logo h1{font-family:'Playfair Display',serif;font-size:1.22rem;letter-spacing:.01em}
    .sb-logo span{display:block;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;opacity:.38;margin-top:.18rem}
    .sb-nav{padding:1.1rem .7rem .5rem;flex:1}
    .sb-section-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.16em;opacity:.35;padding:0 .7rem;margin-bottom:.35rem;margin-top:.6rem}
    .nav-item{display:flex;align-items:center;gap:.65rem;padding:.62rem .8rem;border-radius:6px;font-size:.875rem;font-weight:400;opacity:.6;transition:background .15s,opacity .15s;cursor:pointer}
    .nav-item:hover{background:rgba(255,255,255,.07);opacity:.82}
    .nav-item.active{background:rgba(192,24,42,.22);border-left:3px solid #c0182a;opacity:1;font-weight:600}
    .nav-icon{font-size:.95rem;width:20px;text-align:center;flex-shrink:0}
    .sb-user{padding:1rem 1.4rem;border-top:1px solid rgba(255,255,255,.07)}
    .sb-user-name{font-size:.85rem;font-weight:500}
    .sb-user-role{font-size:.68rem;opacity:.38;text-transform:uppercase;letter-spacing:.09em;margin-top:.1rem}
    .logout-btn{margin-top:.7rem;font-size:.75rem;opacity:.4;background:none;border:none;color:#fff;padding:0;transition:opacity .15s}
    .logout-btn:hover{opacity:.8}

    /* ── PAGE ── */
    .ph{padding:2rem 2rem 1.3rem;border-bottom:2px solid var(--border);background:linear-gradient(135deg,#fff 70%,#eef2f9 100%)}
    .ph-tag{font-size:.63rem;text-transform:uppercase;letter-spacing:.15em;color:#c0182a;font-weight:700;margin-bottom:.25rem}
    .ph-title{font-family:'Playfair Display',serif;font-size:1.75rem;font-weight:700;color:#003087}
    .ph-sub{font-size:.8rem;color:var(--muted);margin-top:.18rem}
    .pb{padding:1.8rem 2rem}

    /* ── CARDS ── */
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);border-top:3px solid #003087}
    .ch{display:flex;align-items:center;gap:.7rem;padding:1.1rem 1.5rem;border-bottom:1px solid var(--border)}
    .ci{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
    .ci-r{background:rgba(192,24,42,.1);color:#c0182a}
    .ci-n{background:rgba(0,48,135,.1);color:#003087}
    .ci-g{background:rgba(0,48,135,.1);color:#003087}
    .ci-v{background:rgba(192,24,42,.08);color:#c0182a}
    .ct{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:600;color:var(--navy)}
    .cc{margin-left:auto;font-size:.72rem;color:var(--muted)}

    /* ── GRIDS ── */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem}

    /* ── STAT CARDS ── */
    .sc{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:1.2rem 1.4rem;box-shadow:var(--shadow);border-top:3px solid #003087}
    .sc-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:.35rem}
    .sc-val{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;color:var(--navy);line-height:1}
    .sc-sub{font-size:.73rem;color:var(--muted);margin-top:.25rem}

    /* ── TABLE ── */
    .tw{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.855rem}
    th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:#003087;font-weight:700;padding:.7rem 1.1rem;border-bottom:2px solid #003087;white-space:nowrap}
    td{padding:.72rem 1.1rem;border-bottom:1px solid var(--border);color:var(--ink)}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(29,44,72,.025)}

    /* ── TOGGLE ── */
    .toggle{width:38px;height:22px;border-radius:11px;border:none;position:relative;transition:background .2s;flex-shrink:0}
    .toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;transition:left .2s}
    .toggle.on{background:#003087}
    .toggle.on::after{left:19px}
    .toggle.off{background:#c8d2e0}
    .toggle.off::after{left:3px}

    /* ── BADGES ── */
    .badge{display:inline-block;font-size:.61rem;font-weight:600;padding:.2em .65em;border-radius:3px;text-transform:uppercase;letter-spacing:.06em}
    .bv{background:rgba(0,48,135,.1);color:#003087}
    .br{background:rgba(192,24,42,.1);color:#c0182a}
    .bg{background:rgba(0,48,135,.07);color:#003087}
    .bn{background:#0a0c10;color:#fff}

    /* ── PROGRESS ── */
    .prog-wrap{height:5px;background:var(--border);border-radius:10px;overflow:hidden;margin-top:.4rem}
    .prog{height:100%;border-radius:10px;transition:width .4s}

    /* ── MATERIALS ── */
    .mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;padding:1.5rem}
    .mat-card{border:1px solid var(--border);border-radius:7px;padding:1.1rem;cursor:pointer;transition:transform .15s,box-shadow .15s;background:var(--paper)}
    .mat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
    .mat-tag{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.2em .6em;border-radius:3px;display:inline-block;margin-bottom:.6rem}
    .tp{background:rgba(184,64,44,.1);color:var(--rust)}
    .ta{background:rgba(29,44,72,.1);color:var(--navy)}
    .tv{background:rgba(200,144,42,.12);color:#7a5210}
    .mat-title{font-size:.875rem;font-weight:500;margin-bottom:.3rem;line-height:1.35;color:var(--ink)}
    .mat-meta{font-size:.7rem;color:var(--muted)}
    .filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.4rem}

    /* ── WORK ROWS ── */
    .wr{display:flex;align-items:flex-start;gap:.9rem;padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);transition:background .1s}
    .wr:last-child{border-bottom:none}
    .wr:hover{background:rgba(29,44,72,.02)}
    .wd{width:10px;height:10px;border-radius:50%;margin-top:.38rem;flex-shrink:0}
    .wi{flex:1}
    .wn{font-size:.9rem;font-weight:500}
    .wdesc{font-size:.74rem;color:var(--muted);margin-top:.12rem}
    .wdl{font-size:.74rem;margin-top:.28rem}

    /* ── ATT ROW ── */
    .ar{display:flex;align-items:center;gap:.85rem;padding:.75rem 1.5rem;border-bottom:1px solid var(--border)}
    .ar:last-child{border-bottom:none}
    .ar-date{font-size:.8rem;color:var(--muted);width:72px;flex-shrink:0}

    /* ── WORKS CONTROL ── */
    .weh{display:flex;align-items:center;gap:.8rem;padding:1rem 1.5rem;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border)}
    .weh:hover{background:rgba(29,44,72,.025)}
    .wsp{background:rgba(29,44,72,.028);border-bottom:1px solid var(--border)}
    .wsr{display:flex;align-items:center;gap:.8rem;padding:.62rem 2rem;border-bottom:1px solid var(--border)}
    .wsr:last-child{border-bottom:none}

    /* ── CHECKBOXES ── */
    .chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:all .15s;flex-shrink:0;cursor:pointer}
    .chk.chkd{background:var(--green);border-color:var(--green);color:#fff}

    /* ── AVATAR ── */
    .av{border-radius:50%;background:linear-gradient(135deg,#003087,#c0182a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}

    /* ── BUTTONS ── */
    .btn-outline{display:inline-flex;align-items:center;gap:.4rem;padding:.48rem .9rem;border-radius:6px;border:1.5px solid var(--border);background:var(--paper);font-size:.8rem;font-weight:500;color:var(--navy);transition:all .15s}
    .btn-outline:hover{border-color:var(--navy);background:rgba(29,44,72,.04)}
    .btn-primary{background:linear-gradient(135deg,#003087,#002070);color:#fff;border:none;border-radius:8px;padding:.75rem 1.4rem;font-size:.88rem;font-weight:600;transition:background .15s,box-shadow .15s;letter-spacing:.02em;box-shadow:0 2px 8px rgba(0,48,135,.25)}
    .btn-primary:hover{background:linear-gradient(135deg,#c0182a,#9e0e20);box-shadow:0 4px 14px rgba(192,24,42,.3)}
    .btn-primary:disabled{opacity:.38;cursor:not-allowed}

    /* ── INPUT ── */
    .inp{border:1.5px solid var(--border);border-radius:6px;padding:.48rem .8rem;font-size:.85rem;background:var(--cream);color:var(--ink);outline:none;transition:border-color .15s}
    .inp:focus{border-color:var(--navy)}

    /* ── EMPTY ── */
    .empty{text-align:center;padding:3rem;color:var(--muted);font-size:.85rem}
    .empty-icon{font-size:2.4rem;margin-bottom:.8rem;opacity:.35;display:block}

    /* ── LOGIN ── */
    .login-page{min-height:100vh;display:flex;align-items:stretch;background:#fff;overflow:hidden}

    /* Left institutional panel */









    /* Professor card */
    .prof-card{z-index:1;display:flex;flex-direction:column;align-items:center;gap:.9rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:1.5rem 2rem;backdrop-filter:blur(6px);width:100%;max-width:260px;margin-top:1.8rem}
    .prof-photo-wrap{position:relative;cursor:pointer}
    .prof-photo{width:90px;height:90px;border-radius:50%;object-fit:cover;object-position:center 8%;border:3px solid rgba(192,24,42,.7);box-shadow:0 6px 24px rgba(0,0,0,.5)}
    .prof-photo-placeholder{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:.6rem;color:rgba(255,255,255,.35);text-align:center;line-height:1.3;transition:background .2s}
    .prof-photo-placeholder:hover{background:rgba(255,255,255,.13)}
    .prof-photo-placeholder span{font-size:1.3rem;display:block}
    .upload-input{display:none}
    .prof-name{font-family:'Playfair Display',serif;font-size:.95rem;color:#fff;text-align:center;line-height:1.3;white-space:nowrap}
    .prof-title{font-size:.7rem;color:rgba(255,255,255,.42);letter-spacing:.09em;text-transform:uppercase;text-align:center}

    /* Right form panel */
    .login-right{width:420px;flex-shrink:0;background:#fff;border-left:4px solid #c0182a;display:flex;align-items:center;justify-content:center;padding:2.5rem;overflow-y:auto}
    .login-form-inner{width:100%;max-width:360px}
    .login-logo{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--navy);margin-bottom:.25rem}
    .login-logo span{color:#c0182a}
    .login-sub{font-size:.78rem;color:var(--muted);margin-bottom:2rem}
    .login-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:.65rem;font-weight:500}
    .roles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1.6rem}
    .role-btn{padding:1.05rem .8rem;border-radius:9px;border:2px solid var(--border);background:var(--cream);text-align:center;transition:all .15s;cursor:pointer}
    .role-btn:hover{border-color:var(--navy)}
    .role-btn.active{border-color:var(--navy);background:rgba(29,44,72,.055)}
    .role-icon{font-size:1.65rem;margin-bottom:.35rem;display:block}
    .role-lbl{font-size:.85rem;font-weight:500;color:var(--navy)}
    .stu-list{display:flex;flex-direction:column;gap:.38rem;margin-bottom:1.6rem;max-height:240px;overflow-y:auto}
    .stu-opt{display:flex;align-items:center;gap:.75rem;padding:.65rem .9rem;border-radius:7px;border:1.5px solid var(--border);cursor:pointer;transition:all .15s;background:var(--cream)}
    .stu-opt:hover{border-color:var(--navy);background:rgba(29,44,72,.03)}
    .stu-opt.sel{border-color:var(--navy);background:rgba(29,44,72,.07)}
    .stu-opt-name{font-size:.85rem;font-weight:500}
    .teacher-hint{font-size:.8rem;color:var(--muted);margin-bottom:1.6rem;padding:.9rem;background:var(--cream);border-radius:7px;border:1px solid var(--border)}

    @media(max-width:780px){
      .login-page{flex-direction:column}
      .login-left{min-height:auto;flex-direction:row;flex-wrap:wrap}.left-top{flex:none;width:100%;padding:1.5rem;flex-direction:row;gap:1rem;background:linear-gradient(to right,#001a5c,#003087)}.left-bottom{width:100%;padding:1rem;flex-direction:row;background:#fff;justify-content:center}
      .login-right{width:100%;flex:1}
      .prof-card{flex-direction:row;padding:1rem 1.4rem;max-width:none;gap:1.1rem}
      .ufpa-logo-wrap img{width:64px}
  
    /* ── LEFT PANEL ── */
    .login-left{
      flex:1;min-width:0;position:relative;overflow:hidden;
      background:linear-gradient(to bottom,
        #001a5c 0%,
        #003087 50%,
        #5a82bb 68%,
        #a8c0e0 78%,
        #ffffff 88%,
        #ffffff 100%
      );
      display:flex;flex-direction:column;
    }
    .left-top{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:3rem 2.5rem 1.5rem;gap:1.8rem;position:relative;
    }
    .left-top::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;border:1px solid rgba(255,255,255,.06);top:-160px;right:-160px;pointer-events:none}
    .left-bottom{
      padding:1.5rem 2.5rem 2.5rem;
      display:flex;flex-direction:column;align-items:center;gap:1rem;
    }
    .ufpa-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:.8rem}
    .ufpa-logo-wrap img{width:80px;height:auto}
    .ufpa-name{
      font-family:'Playfair Display',serif;font-size:1rem;
      color:#003087;text-align:center;line-height:1.35;font-weight:700;letter-spacing:.01em;
    }
    .ufpa-name small{
      display:block;font-family:'DM Sans',sans-serif;
      font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
      color:#1a202c;margin-top:.25rem;font-weight:500;
    }

    .divider-h{display:none}
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .35s ease both}
    @keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

    /* ── RESPONSIVE ── */
    @media(max-width:768px){
      :root{--sidebar:200px}
      .g2,.g3{grid-template-columns:1fr}
      .pb{padding:1.2rem}
      .ph{padding:1.2rem}
    }
    @media(max-width:560px){
      .layout{flex-direction:column}
      .sidebar{width:100%;height:auto;flex-direction:row;overflow-x:auto}
      .sb-nav{display:flex;flex-direction:row;padding:.5rem;gap:.3rem}
      .sb-logo,.sb-user,.sb-section-lbl{display:none}
      .nav-item{flex-direction:column;gap:.15rem;font-size:.65rem;padding:.5rem .7rem;opacity:.7;white-space:nowrap}
      .nav-item .nav-icon{font-size:1.1rem;width:auto}
      .nav-item.active{opacity:1}
    }

    /* ── PASSWORD SCREEN ── */
    .pwd-screen{position:fixed;inset:0;background:linear-gradient(135deg,#003087 0%,#001a52 100%);display:flex;align-items:center;justify-content:center;z-index:9999}
    .pwd-box{background:#fff;border-radius:16px;padding:2.5rem 2.8rem;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center}
    .pwd-logo{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:#003087;letter-spacing:-.02em;margin-bottom:.3rem}
    .pwd-logo span{color:#c0182a}
    .pwd-subtitle{font-size:.8rem;color:#7a8494;margin-bottom:1.8rem;letter-spacing:.03em}
    .pwd-label{font-size:.75rem;font-weight:600;color:#4a5568;text-align:left;margin-bottom:.4rem;letter-spacing:.06em;text-transform:uppercase}
    .pwd-input-wrap{position:relative;margin-bottom:.5rem}
    .pwd-input{width:100%;padding:.75rem 2.8rem .75rem 1rem;border:2px solid #e2e8f0;border-radius:8px;font-size:1rem;letter-spacing:.18em;outline:none;transition:border .2s;box-sizing:border-box;font-family:monospace}
    .pwd-input:focus{border-color:#003087}
    .pwd-toggle{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:#7a8494;padding:0}
    .pwd-error{font-size:.78rem;color:#c0182a;min-height:1.1rem;margin-bottom:.8rem;text-align:left}
    .pwd-btn{width:100%;padding:.85rem;background:linear-gradient(135deg,#003087,#002070);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:opacity .15s}
    .pwd-btn:hover{opacity:.88}
    .pwd-hint{margin-top:1.2rem;font-size:.72rem;color:#a0aec0}

    /* ── LEFT PANEL ── */
    .login-left{
      flex:1;min-width:0;position:relative;overflow:hidden;
      background:linear-gradient(to bottom,
        #001a5c 0%,
        #003087 50%,
        #5a82bb 68%,
        #a8c0e0 78%,
        #ffffff 88%,
        #ffffff 100%
      );
      display:flex;flex-direction:column;
    }
    .left-top{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:3rem 2.5rem 1.5rem;gap:1.8rem;position:relative;
    }
    .left-top::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;border:1px solid rgba(255,255,255,.06);top:-160px;right:-160px;pointer-events:none}
    .left-bottom{
      padding:1.5rem 2.5rem 2.5rem;
      display:flex;flex-direction:column;align-items:center;gap:1rem;
    }
    .ufpa-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:.8rem}
    .ufpa-logo-wrap img{width:80px;height:auto}
    .ufpa-name{
      font-family:'Playfair Display',serif;font-size:1rem;
      color:#003087;text-align:center;line-height:1.35;font-weight:700;letter-spacing:.01em;
    }
    .ufpa-name small{
      display:block;font-family:'DM Sans',sans-serif;
      font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
      color:#1a202c;margin-top:.25rem;font-weight:500;
    }

    .divider-h{display:none}

    .mat-tag.ts{background:#ede9fe;color:#6d28d9}
    .btn-primary{padding:.6rem 1.2rem;background:var(--navy);color:#fff;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:.88rem}
    .btn-primary:hover{opacity:.88}
  </style>
</head>
<body>
<div id="root"></div>
<script>
  // Clear legacy keys from old version
  ['ac_classes','ac_att','ac_del'].forEach(k => localStorage.removeItem(k));
</script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ── DATA ─────────────────────────────────────────────────── */
const STUDENTS = [
  { id:1,  name:'Liandra Monalisa Rodrigues Santos',      ini:'LI' },

function PasswordScreen({ onUnlock }) {
  const { useState } = React;
  const [pwd, setPwd]       = useState('');
  const [show, setShow]     = useState(false);
  const [error, setError]   = useState('');

  function attempt() {
    if (pwd === 'NAEA019') {
      onUnlock();
    } else {
      setError('Senha incorreta. Tente novamente.');
      setPwd('');
    }
  }

  return (
    <div className="pwd-screen">
      <div className="pwd-box">
        <div className="pwd-logo">Acadêmi<span>Co</span></div>
        <div className="pwd-subtitle">Portal Acadêmico · NAEA · UFPA</div>
        <div className="pwd-label">Senha de acesso</div>
        <div className="pwd-input-wrap">
          <input
            className="pwd-input"
            type={show ? 'text' : 'password'}
            placeholder="••••••••"
            value={pwd}
            autoFocus
            onChange={e => { setPwd(e.target.value); setError(''); }}
            onKeyDown={e => e.key === 'Enter' && attempt()}
          />
          <button className="pwd-toggle" onClick={() => setShow(s => !s)}>
            {show ? '🙈' : '👁️'}
          </button>
        </div>
        <div className="pwd-error">{error}</div>
        <button className="pwd-btn" onClick={attempt}>Entrar →</button>
        <div className="pwd-hint">Acesso restrito à turma NAEA019 · 2026.1</div>
      </div>
    </div>
  );
}

function MaterialsGallery({ materials }) {
  const [filter, setFilter] = useState('all');
  const conf = {
    pdf:     { tag:'tp', lbl:'PDF',    ico:'📄', btn:'⬇️ Baixar',   action:'download' },
    article: { tag:'ta', lbl:'Artigo', ico:'📰', btn:'🔗 Acessar',  action:'open'     },
    video:   { tag:'tv', lbl:'Vídeo',  ico:'🎬', btn:'▶️ Assistir', action:'open'     },
    slides:  { tag:'ts', lbl:'Slides', ico:'📊', btn:'⬇️ Baixar',   action:'download' },
  };

  const filtered = filter==='all' ? materials : materials.filter(m=>m.type===filter);

  function openMaterial(m) {
    if (!m.url) return alert('Link não disponível ainda.');
    window.open(m.url, '_blank');
  }

  return (
    <div>
      <div className="ph">
        <div className="ph-tag">Materiais de Estudo</div>
        <div className="ph-title">Galeria de Materiais</div>
        <div className="ph-sub">PDFs, artigos científicos e vídeos da disciplina</div>
      </div>
      <div className="pb">
        <div className="filter-bar">
          {['all','pdf','slides','article','video'].map(t => (
            <button key={t} className="btn-outline"
              style={filter===t?{borderColor:'var(--navy)',background:'rgba(29,44,72,.08)',fontWeight:600}:{}}
              onClick={() => setFilter(t)}>
              {t==='all'?'Todos':conf[t]?.lbl||t}
            </button>
          ))}
        </div>
        {filtered.length === 0 ? (
          <div className="card" style={{padding:'3rem',textAlign:'center',color:'var(--muted)'}}>
            <div style={{fontSize:'2.5rem',marginBottom:'1rem'}}>📭</div>
            <div style={{fontWeight:600,marginBottom:'.4rem'}}>Nenhum material disponível</div>
            <div style={{fontSize:'.85rem'}}>O professor ainda não postou materiais nesta categoria.</div>
          </div>
        ) : (
          <div className="card" style={{overflow:'hidden'}}>
            <div className="mat-grid">
              {filtered.map(m => {
                const c = conf[m.type] || conf['article'];
                return (
                  <div key={m.id} className="mat-card">
                    <span className={`mat-tag ${c.tag}`}>{c.ico} {c.lbl}</span>
                    <div className="mat-title">{m.title}</div>
                    {m.desc && <div className="mat-meta" style={{marginBottom:'.5rem'}}>{m.desc}</div>}
                    <div className="mat-meta">{m.date}</div>
                    <button
                      onClick={() => openMaterial(m)}
                      style={{marginTop:'.8rem',width:'100%',padding:'.5rem',background:m.url?'var(--navy)':'var(--border)',color:m.url?'#fff':'var(--muted)',border:'none',borderRadius:6,fontSize:'.8rem',fontWeight:600,cursor:m.url?'pointer':'default'}}>
                      {m.url ? c.btn : '🔒 Em breve'}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════

function MyAttendance({ studentId, attendance, classes }) {
  const total   = classes.length;
  const present = classes.filter(c => attendance[c]?.[studentId]).length;
  const pct     = total > 0 ? Math.round((present/total)*100) : 0;
  const ok      = pct >= 75;

  return (
    <div>
      <div className="ph">
        <div className="ph-tag">Presença</div>
        <div className="ph-title">Minha Frequência</div>
        <div className="ph-sub">Histórico de comparecimento às aulas</div>
      </div>
      <div className="pb">
        <div className="g3" style={{marginBottom:'1.5rem'}}>
          {[
            {lbl:'Presenças',  val:present,       sub:`de ${total} aulas`,     c:'var(--green)'},
            {lbl:'Faltas',     val:total-present, sub:'aulas perdidas',         c:total-present>0?'var(--rust)':'var(--green)'},
            {lbl:'Frequência', val:`${pct}%`,     sub:'mínimo exigido: 75%',   c:ok?'var(--green)':'var(--rust)'},
          ].map((s,i) => (
            <div key={i} className="sc">
              <div className="sc-lbl">{s.lbl}</div>
              <div className="sc-val" style={{color:s.c}}>{s.val}</div>
              <div className="sc-sub">{s.sub}</div>
            </div>
          ))}
        </div>
        <div className="card" style={{overflow:'hidden'}}>
          <div className="ch">
            <div className="ci ci-n">📅</div>
            <span className="ct">Histórico por Aula</span>
            <span className="cc">{present}/{total} presenças</span>
          </div>
          <div style={{padding:'1rem 1.5rem .4rem'}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'.73rem',color:'var(--muted)',marginBottom:'.25rem'}}>
              <span>Frequência acumulada</span><span style={{fontWeight:600,color:ok?'#003087':'#c0182a'}}>{pct}%</span>
            </div>
            <div className="prog-wrap" style={{height:7}}>
              <div className="prog" style={{width:`${pct}%`,background:ok?'#003087':'#c0182a'}}></div>
            </div>
            {!ok && <div style={{fontSize:'.7rem',color:'var(--rust)',marginTop:'.3rem'}}>⚠️ Frequência abaixo do mínimo exigido (75%)</div>}
          </div>
          {classes.length===0 && <div className="empty"><span className="empty-icon">📭</span>Nenhuma aula registrada ainda.</div>}
          {classes.map(c => {
            const p = attendance[c]?.[studentId];
            return (
              <div key={c} className="ar">
                <div className="ar-date">{c}</div>
                <span style={{fontSize:'.95rem'}}>{p?'✅':'❌'}</span>
                <span style={{fontSize:'.85rem',fontWeight:500,color:p?'var(--green)':'var(--rust)'}}>{p?'Presente':'Ausente'}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   CHAMADA (teacher)
═══════════════════════════════════════════════════════════ */
function AttendanceRegister({ attendance, setAttendance, classes, setClasses }) {
  const [newDate, setNewDate] = useState('');

  function toggle(cls, sid) {
    const upd = { ...attendance, [cls]: { ...attendance[cls], [sid]: !attendance[cls]?.[sid] } };
    setAttendance(upd);
  }

  function markAll(cls, val) {
    const upd = { ...attendance, [cls]: Object.fromEntries(STUDENTS.map(s => [s.id, val])) };
    setAttendance(upd);
  }

  function addClass() {
    const d = newDate.trim();
    if (!d || classes.includes(d)) return;
    setClasses([...classes, d]);
    setAttendance(prev => ({ ...prev, [d]: Object.fromEntries(STUDENTS.map(s => [s.id, false])) }));
    setNewDate('');
  }

  return (
    <div>
      <div className="ph">
        <div className="ph-tag">Professor · Chamada</div>
        <div className="ph-title">Registro de Frequência</div>
        <div className="ph-sub">Marque presença ou ausência por aula</div>
      </div>
      <div className="pb">
        <div style={{display:'flex',gap:'.6rem',marginBottom:'1.4rem',flexWrap:'wrap',alignItems:'center'}}>
          <input className="inp" style={{width:180}} placeholder="Nova aula (ex: 31/03)"
            value={newDate} onChange={e => setNewDate(e.target.value)}
            onKeyDown={e => e.key==='Enter' && addClass()} />
          <button className="btn-outline" onClick={addClass}>+ Adicionar Aula</button>
        </div>

        {classes.length===0 && (
          <div className="card"><div className="empty"><span className="empty-icon">📭</span>Nenhuma aula ainda. Adicione acima.</div></div>
        )}

        {classes.map(cls => {
          const pres = STUDENTS.filter(s => attendance[cls]?.[s.id]).length;
          return (
            <div key={cls} className="card" style={{overflow:'hidden',marginBottom:'1.2rem'}}>
              <div className="ch">
                <div className="ci ci-n">📋</div>
                <span className="ct">Aula {cls}</span>
                <span className="cc">{pres}/{STUDENTS.length} presentes</span>
                <div style={{marginLeft:'auto',display:'flex',gap:'.45rem'}}>
                  <button className="btn-outline" style={{fontSize:'.7rem',padding:'.32rem .65rem'}} onClick={()=>markAll(cls,true)}>Todos ✓</button>
                  <button className="btn-outline" style={{fontSize:'.7rem',padding:'.32rem .65rem'}} onClick={()=>markAll(cls,false)}>Todos ✗</button>
                </div>
              </div>
              {STUDENTS.map(s => {
                const p = attendance[cls]?.[s.id] || false;
                return (
                  <div key={s.id} style={{display:'flex',alignItems:'center',gap:'.85rem',padding:'.68rem 1.5rem',borderBottom:'1px solid var(--border)'}}>
                    <Avatar ini={s.ini} size={30} />
                    <span style={{flex:1,fontSize:'.88rem',fontWeight:500}}>{s.name}</span>
                    <span className={`badge ${p?'bv':'br'}`} style={{marginRight:'.8rem'}}>{p?'Presente':'Ausente'}</span>
                    <button className={`toggle ${p?'on':'off'}`} onClick={() => toggle(cls, s.id)} />
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function WorksControl({ deliveries, setDeliveries, formUrls, setFormUrls }) {

              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   DASHBOARDS
═══════════════════════════════════════════════════════════ */
function StudentDashboard({ user, onLogout, attendance, deliveries, classes, formUrls }) {
  const [tab, setTab] = useState('trabalhos');
  return (
    <div className="layout">
      <Sidebar user={user} tab={tab} setTab={setTab} onLogout={onLogout} />
      <div className="main">

        {tab==='trabalhos'  && <MyWorks studentId={user.id} deliveries={deliveries} formUrls={formUrls} user={user} />}
        {tab==='frequencia' && <MyAttendance studentId={user.id} attendance={attendance} classes={classes} />}
      </div>
    </div>
  );
}

function TeacherDashboard({ user, onLogout, attendance, setAttendance, deliveries, setDeliveries, classes, setClasses, formUrls, setFormUrls }) {
  const [tab, setTab] = useState('turma');
  return (
    <div className="layout">
      <Sidebar user={user} tab={tab} setTab={setTab} onLogout={onLogout} />
      <div className="main">
        {tab==='turma'     && <StudentList attendance={attendance} deliveries={deliveries} classes={classes} />}
        {tab==='chamada'   && <AttendanceRegister attendance={attendance} setAttendance={setAttendance} classes={classes} setClasses={setClasses} />}
        {tab==='trabalhos' && <WorksControl deliveries={deliveries} setDeliveries={setDeliveries} formUrls={formUrls} setFormUrls={setFormUrls} />}

      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════════════════ */
function App() {
  // ── All hooks first (React rules) ──
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem('naea_unlocked') === '1');
  const [user, setUser]         = useState(null);
  const [classes, setClasses]   = useState(() => load('ufpa_classes_v3', INIT_CLASSES));
  const [attendance, setAttendance] = useState(() => load('ufpa_att_v3', defAtt(load('ufpa_classes_v3', INIT_CLASSES))));
  const [deliveries, setDeliveries] = useState(() => load('ufpa_del_v2', defDel()));
  const [formUrls, setFormUrls]     = useState(() => load('ufpa_forms_v3', defForms()));


  useEffect(() => { save('ufpa_classes_v3', classes);    }, [classes]);
  useEffect(() => { save('ufpa_att_v3',     attendance); }, [attendance]);
  useEffect(() => { save('ufpa_del_v2',     deliveries); }, [deliveries]);
  useEffect(() => { save('ufpa_forms_v3',   formUrls);   }, [formUrls]);


  // ── Conditional renders AFTER hooks ──
  if (!unlocked) return <PasswordScreen onUnlock={() => { sessionStorage.setItem('naea_unlocked','1'); setUnlocked(true); }} />;

  if (!user) return <LoginScreen onLogin={setUser} />;

  const props = { user, onLogout: () => setUser(null), attendance, deliveries, classes, formUrls };

  if (user.role === 'teacher')
    return <TeacherDashboard {...props} setAttendance={setAttendance} setDeliveries={setDeliveries} setClasses={setClasses} setFormUrls={setFormUrls} />;

  return <StudentDashboard {...props} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
